name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release

      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal_romanian_whist-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: build-release/terminal_romanian_whist-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: terminal_romanian_whist-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
