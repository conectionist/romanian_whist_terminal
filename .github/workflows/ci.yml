name: CI

# A pull request is built by its pull_request run, so push builds only master.
# Building every pushed branch as well ran each PR's builds twice, and a pushed
# tag rebuilt a commit master had already built. A branch with no PR can still
# be built by hand with "Run workflow".
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Runs on master are never
# cancelled, so one merge cannot cut short the run (or release) of the last.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release

      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release

      # --no-tests=error, because a build that lands with tests disabled would
      # otherwise print "No tests were found!!!" and exit 0 - green having run
      # nothing. The engine's CI learned this the hard way in Phase 0.
      - name: Test
        run: ctest --preset release --output-on-failure --no-tests=error

      - name: Rename binary
        run: mv "build-release/terminal_romanian_whist-${{ steps.version.outputs.version }}" "build-release/terminal_romanian_whist-${{ steps.version.outputs.version }}-linux"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal_romanian_whist-${{ steps.version.outputs.version }}-linux
          path: build-release/terminal_romanian_whist-*

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release

      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release

      # --no-tests=error, because a build that lands with tests disabled would
      # otherwise print "No tests were found!!!" and exit 0 - green having run
      # nothing. The engine's CI learned this the hard way in Phase 0.
      - name: Test
        run: ctest --preset release --output-on-failure --no-tests=error

      - name: Rename binary
        shell: bash
        run: mv "build-release/terminal_romanian_whist-${{ steps.version.outputs.version }}.exe" "build-release/terminal_romanian_whist-${{ steps.version.outputs.version }}-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal_romanian_whist-${{ steps.version.outputs.version }}-windows
          path: build-release/terminal_romanian_whist-*

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release

      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release

      # --no-tests=error, because a build that lands with tests disabled would
      # otherwise print "No tests were found!!!" and exit 0 - green having run
      # nothing. The engine's CI learned this the hard way in Phase 0.
      - name: Test
        run: ctest --preset release --output-on-failure --no-tests=error

      - name: Rename binary
        run: mv "build-release/terminal_romanian_whist-${{ steps.version.outputs.version }}" "build-release/terminal_romanian_whist-${{ steps.version.outputs.version }}-macos"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal_romanian_whist-${{ steps.version.outputs.version }}-macos
          path: build-release/terminal_romanian_whist-*

  release:
    needs: [build-linux, build-windows, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.version.outputs.is_new == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: terminal_romanian_whist-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        if: steps.version.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/*
