name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release

      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal_romanian_whist-${{ steps.version.outputs.version }}-linux
          path: build-release/terminal_romanian_whist-*

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release

      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal_romanian_whist-${{ steps.version.outputs.version }}-windows
          path: build-release/terminal_romanian_whist-*

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release

      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal_romanian_whist-${{ steps.version.outputs.version }}-macos
          path: build-release/terminal_romanian_whist-*

  release:
    needs: [build-linux, build-windows, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.version.outputs.is_new == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: terminal_romanian_whist-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        if: steps.version.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/*
